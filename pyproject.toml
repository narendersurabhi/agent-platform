[project]
name = "agent-platform"
version = "0.1.0"
description = "Shared conventions, decision records, contract tooling and the service template for the agent services."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.4",
    "openapi-spec-validator>=0.7",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.uv]
# Always use a uv-managed interpreter in the project .venv, never a system Python.
python-preference = "only-managed"
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
markers = [
    "spec(*ids): requirement IDs from specs/*/spec.md that this test verifies",
]
